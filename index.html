<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <!-- Dark mode restore — must run before body renders to prevent flash -->
  <script>
    (function() {
      var saved = localStorage.getItem("nukhba_theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = saved || (prefersDark ? "dark" : "light");
      if (theme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = "#0f172a";
      }
    })();
  </script>

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0f766e"/>
  <meta name="description" content="النخبة للشحن السريع — منصة لوجستية متكاملة لإدارة الشحن والتوصيل والتتبع في مصر"/>
  <title>النخبة للشحن السريع</title>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <link rel="stylesheet" href="./styles.css"/>
</head>
<body>
  <div id="app"></div>

  <!-- Core libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
